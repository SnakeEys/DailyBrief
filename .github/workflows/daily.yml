name: Daily Brief

# Generate a fresh daily report and publish to GitHub Pages.
#
# One-time setup for forkers (see README → "Run on GitHub Actions"):
#   1. Settings → Actions → General → enable workflows (forked repos start disabled)
#   2. Settings → Pages → Build & deployment → Source: "Deploy from a branch" → gh-pages / root
#   3. Settings → Secrets and variables → Actions:
#        - Secrets: ANTHROPIC_API_KEY (or OPENAI / DEEPSEEK / MINIMAX / ZHIPU as you prefer)
#        - Variables (all optional, sensible defaults provided):
#            LLM_BACKEND     anthropic | openai | deepseek | minimax | zhipu    (default: anthropic)
#            LLM_MODEL       e.g. claude-sonnet-4-6 / gpt-4o-mini       (backend default if unset)
#            REPORT_LOCALE   zh | en                                    (default: zh)
#            REPORT_TZ       IANA tz, e.g. Asia/Shanghai / UTC          (default: UTC in CI)
#            REPORT_HOUR     trigger hour(s) in REPORT_TZ, comma-list   (default: 8 — 08:00)
#                            examples: "8" / "8,18" / "0,6,12,18"
#            REPORT_DAYS     day-of-week filter (cron-style 0-6 SUN=0)  (default: * — every day)
#                            examples: "*" / "1-5" (weekdays) / "1,3,5" (MWF)
#   4. Trigger once manually from Actions tab to seed gh-pages.
#
# After first successful run your report is live at:
#   https://<your-username>.github.io/<repo-name>/
#
# Schedule mechanics: cron probes twice per hour because GitHub Actions cron is
# UTC-only and we want the user's local-timezone hour. A short "gate" job checks
# the current hour in REPORT_TZ against REPORT_HOUR and only allows the build
# job to run when they match. workflow_dispatch always bypasses the gate.

on:
  schedule:
    # 探测频率：每 30 分钟一次（分钟 7 和 37）。GitHub Actions 会静默丢弃
    # 约 30% 的 cron 触发，所以用高频探测 + gate 按 REPORT_HOUR 过滤，
    # 保证 8/14/20 每个档位都不会因单次触发被丢弃而漏报。
    # 实际出报只发生在 REPORT_HOUR 命中且本小时尚未出报时 → 每天恰好 3 次。
    # 想改出报时间：只改 REPORT_HOUR 变量即可（GitHub → Settings → Variables），
    # 不需要动 cron（它始终高频探测，由 gate 决定是否出报）。
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # needed to push to gh-pages branch

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  gate:
    name: Time gate
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - name: Check schedule
        id: check
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          REPORT_HOUR: ${{ vars.REPORT_HOUR }}
          REPORT_DAYS: ${{ vars.REPORT_DAYS }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Manual triggers always run — user clicked Run workflow.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger — bypassing time gate"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TZ_VAL="${REPORT_TZ:-UTC}"
          HOURS_VAL="${REPORT_HOUR:-8}"
          DAYS_VAL="${REPORT_DAYS:-*}"

          NOW_HOUR=$(TZ="$TZ_VAL" date +%-H)
          NOW_DOW=$(TZ="$TZ_VAL" date +%w)
          NOW_PRINT=$(TZ="$TZ_VAL" date '+%Y-%m-%d %H:%M %Z')

          echo "Now in $TZ_VAL: $NOW_PRINT (hour=$NOW_HOUR, dow=$NOW_DOW)"
          echo "Configured REPORT_HOUR='$HOURS_VAL', REPORT_DAYS='$DAYS_VAL'"

          # Hour match: comma-separated list of integers (0-23).
          hour_match=false
          IFS=',' read -ra HLIST <<< "$HOURS_VAL"
          for h in "${HLIST[@]}"; do
            h_trim="${h// /}"
            if [ "$NOW_HOUR" = "$h_trim" ]; then
              hour_match=true
              break
            fi
          done

          # Day-of-week match: '*', single digits, ranges "a-b", or comma combos.
          day_match=false
          if [ "$DAYS_VAL" = "*" ]; then
            day_match=true
          else
            IFS=',' read -ra DLIST <<< "$DAYS_VAL"
            for d in "${DLIST[@]}"; do
              d_trim="${d// /}"
              if [[ "$d_trim" == *-* ]]; then
                start="${d_trim%-*}"
                end="${d_trim#*-}"
                if [ "$NOW_DOW" -ge "$start" ] && [ "$NOW_DOW" -le "$end" ]; then
                  day_match=true
                  break
                fi
              else
                if [ "$NOW_DOW" = "$d_trim" ]; then
                  day_match=true
                  break
                fi
              fi
            done
          fi

          # Catchup branch — covers GitHub Actions silently dropping scheduled
          # triggers (which happens to ~30% of cron runs, especially at the
          # exact target hour). Fires when:
          #   1. day matches AND
          #   2. exact hour didn't match AND
          #   3. we're past today's earliest REPORT_HOUR AND
          #   4. today's report doesn't yet exist on gh-pages
          # Once today's report is published, this branch self-suppresses on
          # subsequent gate runs — no double-builds per day.
          catchup_match=false
          if [ "$day_match" = "true" ] && [ "$hour_match" = "false" ]; then
            earliest_hour=99
            for h in "${HLIST[@]}"; do
              h_trim="${h// /}"
              if [ "$h_trim" -lt "$earliest_hour" ]; then
                earliest_hour=$h_trim
              fi
            done
            # Fire catchup only once we're AT or past the earliest report
            # hour. No "1h early" tolerance: with an 8/14/20 schedule a
            # 07:XX probe firing catchup produced a premature report, and
            # then the normal 08:00 slot built a second one — two pushes/day.
            # The 30-min probes inside the target hour are the real safety
            # net; catchup now only recovers when those were all swallowed.
            catchup_threshold=$earliest_hour
            if [ "$NOW_HOUR" -ge "$catchup_threshold" ]; then
              TODAY=$(TZ="$TZ_VAL" date +%Y-%m-%d)
              CHECK_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${TODAY}/${TODAY}.html?ref=gh-pages"
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$CHECK_URL" || echo "000")
              if [ "$HTTP_CODE" = "404" ]; then
                echo "↻ Catchup: today's report ($TODAY) missing from gh-pages — recovering"
                catchup_match=true
              else
                echo "Catchup check: today's report exists (HTTP $HTTP_CODE) — no action"
              fi
            fi
          fi

          # Per-hour dedup: GitHub cron now probes every 30 min, so two probes
          # can land in the same REPORT_HOUR slot (e.g. 14:07 + 14:37). We want
          # exactly ONE report per target hour. If today's report was already
          # published within the current Beijing hour, skip the duplicate.
          dedup_skip=false
          if [ "$hour_match" = "true" ] && [ "$day_match" = "true" ]; then
            TODAY=$(TZ="$TZ_VAL" date +%Y-%m-%d)
            LAST_COMMIT=$(curl -s \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits?path=${TODAY}/${TODAY}.md&sha=gh-pages&per_page=1" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['commit']['committer']['date'] if d else '')")
            if [ -n "$LAST_COMMIT" ]; then
              COMMIT_HOUR=$(TZ="$TZ_VAL" date -d "$LAST_COMMIT" +%-H 2>/dev/null || echo "")
              echo "Dedup check: last report commit hour=$COMMIT_HOUR, now hour=$NOW_HOUR"
              if [ "$COMMIT_HOUR" = "$NOW_HOUR" ]; then
                dedup_skip=true
              fi
            fi
          fi

          if [ "$dedup_skip" = "true" ]; then
            echo "✗ Same-hour report already published — skipping duplicate"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          elif [ "$hour_match" = "true" ] && [ "$day_match" = "true" ]; then
            echo "✓ Match — proceeding to build"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          elif [ "$catchup_match" = "true" ]; then
            echo "✓ Catchup — proceeding to build"
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "✗ No match — skipping (hour=$hour_match day=$day_match catchup=$catchup_match)"
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bring previous reports into the workspace so they survive each run
      # and so build-site can list them all in the archive.
      - name: Restore existing reports from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git --work-tree=daily_reports checkout origin/gh-pages -- . || true
            # Drop the index/archive — build-site regenerates them
            rm -f daily_reports/index.html daily_reports/archive.html
            echo "Restored $(ls -1d daily_reports/20*/ 2>/dev/null | wc -l) prior report dirs"
          else
            echo "gh-pages doesn't exist yet — first run"
          fi

      - name: Generate today's report
        env:
          LLM_BACKEND: ${{ vars.LLM_BACKEND || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # Optional proxy / self-hosted endpoints — forward whatever the
          # forker set in Settings → Variables. Empty values are a no-op
          # (backends fall back to the official URL in code).
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL }}
          ZHIPU_BASE_URL: ${{ vars.ZHIPU_BASE_URL }}
          # Generic aliases — handy when pointing at an OpenAI/Anthropic
          # compatible service that isn't one of the named presets (Moonshot,
          # SiliconFlow, OpenRouter, self-hosted, ...). Provider-specific
          # vars above take precedence when both are set.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          OUTPUT_MARKDOWN: 'true'
          WEB_MODE: 'true'
        run: npm run daily

      - name: Build static site (index + archive)
        run: npm run build-site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false  # we restored everything above, so a clean publish is fine
          commit_message: 'daily: report for ${{ github.run_id }}'

      - name: Push to WeChat via PushPlus
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          REPORT_TZ: ${{ vars.REPORT_TZ || 'Asia/Shanghai' }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then echo "PUSHPLUS_TOKEN 未配置，跳过推送"; exit 0; fi
          TODAY=$(TZ="$REPORT_TZ" date +%F)
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          REPORT_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/${TODAY}/${TODAY}.html"
          MD_FILE="daily_reports/${TODAY}/${TODAY}.md"
          if [ -f "$MD_FILE" ]; then
            python3 -c "import json,os,urllib.request as u; d=json.dumps({'token':os.environ['PUSHPLUS_TOKEN'],'title':'今日行业日报 $TODAY','content':open('$MD_FILE',encoding='utf-8').read()[:3000],'template':'markdown'}); u.urlopen(u.Request('https://www.pushplus.plus/send',data=d.encode(),headers={'Content-Type':'application/json'}),timeout=15)"
          else
            python3 -c "import json,os,urllib.request as u; d=json.dumps({'token':os.environ['PUSHPLUS_TOKEN'],'title':'今日行业日报 $TODAY','content':'点击查看今日日报：$REPORT_URL','template':'txt'}); u.urlopen(u.Request('https://www.pushplus.plus/send',data=d.encode(),headers={'Content-Type':'application/json'}),timeout=15)"
          fi
